spring:
  application:
    name: product-service
  threads:
    virtual:
      enabled: true
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DB:product-db}
    username: ${MONGO_USER:root}
    password: ${MONGO_PASS:password}
    authentication-database: ${MONGO_AUTH_DB:admin}      
server:
  port: 8080
        

